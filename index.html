<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직접 만들며 배우는 머신러닝 · 딥러닝 · LLM · VLM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg:#fbfaf7; --card:#fff; --fg:#22262b; --muted:#6b7480; --line:#e4e1da; --side:#f3f1ec;
  --accent:#2f6fde; --accent-bg:#eaf1fd; --ok:#2da160; --ok-bg:#e8f6ee; --warn-bg:#fff6e0; --warn:#b7791f;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0f1216; --card:#161a20; --fg:#e4e8ee; --muted:#8d97a5; --line:#2a313b; --side:#13171c;
  --accent:#6ea3ff; --accent-bg:#172338; --ok:#4cc38a; --ok-bg:#12281d; --warn-bg:#2b2412; --warn:#e2b04a;
} }
* { box-sizing:border-box; }
html { scroll-padding-top:16px; }
body { margin:0; display:flex; min-height:100vh; background:var(--bg); color:var(--fg);
  font:17px/1.8 "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif; word-break:keep-all; overflow-wrap:anywhere; }
a { color:var(--accent); }

/* ── 사이드바 ── */
nav { width:310px; flex-shrink:0; background:var(--side); border-right:1px solid var(--line); padding:20px 14px 40px; position:sticky; top:0; height:100vh; overflow-y:auto; font-size:14.5px; line-height:1.5; }
nav h1 { font-size:17px; margin:0 6px 12px; line-height:1.4; }
nav h1 a { color:inherit; text-decoration:none; }
.prog { margin:0 6px 6px; height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.prog i { display:block; height:100%; background:var(--ok); transition:width .3s; }
.progtxt { margin:0 6px 12px; color:var(--muted); font-size:13px; display:flex; justify-content:space-between; }
#resume { display:block; margin:0 6px 8px; padding:9px 12px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; text-align:center; }
#resume[hidden] { display:none; }
nav summary { list-style:none; cursor:pointer; display:none; padding:8px 6px; font-weight:600; }
nav h2 { font-size:12.5px; color:var(--muted); margin:18px 6px 4px; letter-spacing:.02em; display:flex; justify-content:space-between; }
nav ol { list-style:none; margin:0; padding:0; }
nav li { display:flex; align-items:flex-start; gap:8px; padding:6px 6px; border-radius:7px; }
nav li input { margin-top:3px; accent-color:var(--ok); }
nav li.on { background:var(--card); box-shadow:0 0 0 1px var(--line); }
nav li a { color:var(--fg); text-decoration:none; flex:1; }
nav li.done a { color:var(--muted); }
nav li.on a { color:var(--accent); font-weight:600; }
nav li .no { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:4px; }
nav .gl { margin:18px 0 0; padding:12px 6px 0; border-top:1px solid var(--line); }
nav .gl a { text-decoration:none; font-weight:600; color:var(--fg); }
nav .gl a.on { color:var(--accent); }

/* ── 본문 ── */
main { flex:1; min-width:0; padding:28px 16px 96px; display:flex; justify-content:center; gap:40px; }
.col { width:100%; max-width:800px; min-width:0; }
.bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:14.5px; margin-bottom:18px; min-height:38px; }
.grow { flex:1; }
.bar .crumb { color:var(--muted); }
.btn { display:inline-block; border:1px solid var(--line); border-radius:8px; padding:7px 14px; text-decoration:none; background:var(--card); color:var(--fg); font:inherit; font-size:14.5px; line-height:1.5; cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.btn.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600; }
.bar input { flex:1; min-width:0; font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
article h1 { font-size:32px; line-height:1.3; margin:0 0 14px; letter-spacing:-.01em; }
article h2 { font-size:23px; margin:2.4em 0 .6em; padding-top:.2em; line-height:1.4; }
article h3 { font-size:18.5px; margin:1.8em 0 .4em; }
article li { margin:.25em 0; }
article pre { position:relative; border-radius:10px; font-size:14px; line-height:1.55; margin:1.2em 0; background:#0d1117; }
article pre code { display:block; padding:16px 18px; overflow-x:auto; background:transparent; color:#e6edf3; font-family:ui-monospace, "Cascadia Code", Consolas, monospace; word-break:normal; overflow-wrap:normal; }
article :not(pre) > code { background:var(--side); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:.88em; font-family:ui-monospace, Consolas, monospace; }
.copy { position:absolute; top:8px; right:8px; font-size:12px; padding:3px 9px; border-radius:6px; border:1px solid #30363d; background:#161b22; color:#9da7b3; cursor:pointer; opacity:0; transition:opacity .15s; }
pre:hover .copy, .copy:focus { opacity:1; }
article blockquote { margin:1.2em 0; padding:.6em 1.1em; border-left:4px solid var(--accent); background:var(--accent-bg); border-radius:0 8px 8px 0; }
article blockquote p { margin:.3em 0; }
article blockquote.meta { border:0; background:none; padding:0; margin:0 0 1.6em; display:flex; flex-wrap:wrap; gap:8px; }
article blockquote.meta span { font-size:13.5px; padding:3px 11px; border-radius:99px; background:var(--side); border:1px solid var(--line); color:var(--muted); }
article table { border-collapse:collapse; display:block; overflow-x:auto; font-size:15.5px; margin:1.2em 0; }
article th, article td { border:1px solid var(--line); padding:7px 13px; text-align:left; }
article th { background:var(--side); }
article img { max-width:100%; }
article hr { border:0; border-top:1px solid var(--line); margin:2.5em 0; }
/* 핵심 정리 · 스스로 점검 · 직접 고쳐보기 */
.box { border:1px solid var(--line); border-radius:12px; padding:4px 22px 12px; margin:2.4em 0 0; background:var(--card); }
.box > h2 { margin-top:.8em; font-size:20px; }
.box.summary { border-color:var(--ok); background:var(--ok-bg); }
.box.practice { border-color:var(--warn); background:var(--warn-bg); }
article details { border:1px solid var(--line); border-radius:8px; padding:8px 14px; margin:.6em 0; background:var(--bg); }
article details summary { cursor:pointer; font-weight:600; }
article details[open] summary { margin-bottom:.4em; }
/* 용어 툴팁 */
.term { border-bottom:1.5px dotted var(--accent); cursor:help; }
#tip { position:absolute; z-index:10; max-width:min(340px, calc(100vw - 32px)); padding:10px 13px; border-radius:10px; background:var(--fg); color:var(--bg); font-size:14px; line-height:1.6; box-shadow:0 6px 24px rgba(0,0,0,.25); }
#tip b { display:block; margin-bottom:2px; }
#tip[hidden] { display:none; }
/* 레슨 끝 */
.end { margin-top:48px; padding-top:24px; border-top:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.end:empty { display:none; }
/* 오른쪽 목차 */
aside { width:210px; flex-shrink:0; position:sticky; top:28px; align-self:flex-start; max-height:calc(100vh - 56px); overflow-y:auto; font-size:13.5px; line-height:1.5; display:none; }
aside b { display:block; color:var(--muted); margin-bottom:8px; font-size:12.5px; }
aside a { display:block; padding:4px 0 4px 12px; border-left:2px solid var(--line); color:var(--muted); text-decoration:none; }
aside a:hover { color:var(--accent); border-color:var(--accent); }
@media (min-width:1280px) { aside { display:block; } }
@media (max-width:860px) {
  body { display:block; font-size:16px; }
  nav { width:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); padding:14px 12px; }
  nav summary { display:block; }
  article h1 { font-size:26px; } article h2 { font-size:21px; }
  .box { padding:2px 16px 10px; }
}
</style>
</head>
<body>
<nav>
  <h1><a href="#00-start">🧠 직접 만들며 배우는<br>머신러닝 · 딥러닝 · LLM · VLM</a></h1>
  <div class="prog" role="progressbar" aria-label="전체 진도"><i id="progbar"></i></div>
  <p class="progtxt"><span id="progress"></span><span id="pct"></span></p>
  <a id="resume" href="#"></a>
  <details id="menu" open>
    <summary>☰ 목차 열기 / 닫기</summary>
    <div id="toc"></div>
    <p class="gl"><a id="glink" href="#glossary">📖 용어 사전</a></p>
  </details>
</nav>
<main>
  <div class="col">
    <div class="bar" id="bar"></div>
    <article id="content">불러오는 중…</article>
    <div class="end" id="end"></div>
  </div>
  <aside id="aside"></aside>
</main>
<div id="tip" role="tooltip" hidden></div>
<script>
const REPO = "Yun-sooyong/dl-study"; // Colab 링크용. 저장소 이름을 바꾸면 여기도 수정
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 진도 체크는 이 브라우저에만 저장됨 (localStorage)
const done = (() => { try { return new Set(JSON.parse(localStorage.done || "[]")); } catch { return new Set(); } })();
const save = () => { try { localStorage.done = JSON.stringify([...done]); } catch {} };
let lessons = [], terms = new Map(), termRe = null;

function renderToc(cur) {
  const n = lessons.filter(l => done.has(l.id)).length;
  $("progress").textContent = `${n} / ${lessons.length} 레슨 완료`;
  $("pct").textContent = Math.round(100 * n / lessons.length) + "%";
  $("progbar").style.width = 100 * n / lessons.length + "%";
  const todo = lessons.find(l => !done.has(l.id));
  $("resume").hidden = !todo || todo.id === cur;
  if (todo) { $("resume").href = "#" + todo.id; $("resume").textContent = n ? "▶ 이어서 학습하기" : "▶ 학습 시작하기"; }
  $("toc").innerHTML = "";
  for (const part of [...new Set(lessons.map(l => l.part))]) {
    const items = lessons.filter(l => l.part === part);
    const h = document.createElement("h2");
    h.innerHTML = `<span>${esc(part)}</span><span>${items.filter(l => done.has(l.id)).length}/${items.length}</span>`;
    const ol = document.createElement("ol");
    items.forEach((l, k) => {
      const li = document.createElement("li");
      li.className = (l.id === cur ? "on " : "") + (done.has(l.id) ? "done" : "");
      const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: done.has(l.id), title: "완료 표시" });
      cb.setAttribute("aria-label", l.title + " 완료");
      cb.onchange = () => setDone(l.id, cb.checked, cur);
      const a = document.createElement("a");
      a.href = "#" + l.id;
      a.innerHTML = (l.id[0] === "0" ? "" : `<span class="no">${l.id[0]}-${k + 1}</span>`) + esc(l.title);
      li.append(cb, a);
      ol.append(li);
    });
    $("toc").append(h, ol);
  }
}

function setDone(id, on, cur) { on ? done.add(id) : done.delete(id); save(); renderToc(cur); renderEnd(cur); }

function renderEnd(cur) {
  const i = lessons.findIndex(l => l.id === cur), next = lessons[i + 1];
  if (i < 0) return $("end").innerHTML = "";
  $("end").innerHTML = (done.has(cur)
    ? `<button class="btn ok" id="fin">✓ 완료함 (취소)</button>`
    : `<button class="btn primary" id="fin">✓ 이 레슨 완료로 표시</button>`) +
    `<span class="grow"></span>` + (next ? `<a class="btn" href="#${next.id}">다음: ${esc(next.title)} →</a>` : "");
  $("fin").onclick = () => setDone(cur, !done.has(cur), cur);
}

// ── 용어 사전: glossary.md의 '**용어 / 별칭 (english)** — 설명' 문단을 읽어 레슨 본문에 툴팁으로 연결
function parseGlossary(md) {
  const box = document.createElement("div");
  box.innerHTML = marked.parse(md);
  const keys = [];
  box.querySelectorAll("p").forEach(p => {
    const s = p.firstChild;
    if (!s || s.nodeName !== "STRONG") return;
    let def = p.textContent.slice(s.textContent.length).replace(/^\s*—\s*/, "");
    if (p.lastElementChild?.tagName === "A") def = def.replace(/\s*\([^()]*\)\s*$/, "");   // 끝의 '(레슨 링크)' 제거
    const entry = { name: s.textContent, def };
    s.textContent.split(/[\/(),]| vs /).map(k => k.trim()).forEach(k => {
      const ascii = /^[\x00-\x7f]+$/.test(k);
      if (k.length >= 2 && !(ascii && k.length < 3)) keys.push([k.toLowerCase(), entry]);
    });
  });
  if (!keys.length) return;
  keys.sort((a, b) => b[0].length - a[0].length);   // 긴 용어 우선 ('학습률'이 '학습'보다 먼저)
  terms = new Map(keys);
  const alt = keys.map(([k]) => { const e = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return /^[\x00-\x7f]+$/.test(k) ? `(?<![a-z_.])${e}(?![a-z_])` : e; });
  termRe = new RegExp(alt.join("|"), "i");
}

function linkTerms(root) {   // 레슨마다 각 용어의 첫 등장만 연결
  if (!termRe) return;
  const used = new Set(), skip = "PRE,CODE,A,H1,H2,H3,SUMMARY,TH,.meta,.term";
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (let node of nodes) {
    for (let m, from = 0; (m = termRe.exec(node.data.slice(from))); ) {
      const entry = terms.get(m[0].toLowerCase());
      if (!entry || used.has(entry)) { from += m.index + m[0].length; continue; }
      used.add(entry);
      const hit = node.splitText(from + m.index); node = hit.splitText(m[0].length); from = 0;
      const span = Object.assign(document.createElement("span"), { className: "term", tabIndex: 0 });
      span.entry = entry;
      hit.replaceWith(span); span.append(hit);
    }
  }
}

function showTip(el) {
  const tip = $("tip"), r = el.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(el.entry.name)}</b>${esc(el.entry.def)}`;
  tip.hidden = false;
  tip.style.left = Math.max(16, Math.min(r.left, innerWidth - tip.offsetWidth - 16)) + scrollX + "px";
  tip.style.top = r.bottom + scrollY + 6 + "px";
}
for (const ev of ["mouseover", "focusin", "click"]) document.addEventListener(ev, e => { const t = e.target.closest?.(".term"); t ? showTip(t) : ev === "click" && ($("tip").hidden = true); });
for (const ev of ["mouseout", "focusout"]) document.addEventListener(ev, e => e.target.closest?.(".term") && ($("tip").hidden = true));

// ── 본문 꾸미기: 메타 칩, 복사 버튼, 정리/점검/실습 박스, 오른쪽 목차
function decorate(root) {
  root.querySelectorAll("pre code").forEach(el => {
    hljs.highlightElement(el);
    const b = Object.assign(document.createElement("button"), { className: "copy", textContent: "복사" });
    b.onclick = () => navigator.clipboard.writeText(el.textContent).then(() => { b.textContent = "복사됨 ✓"; setTimeout(() => b.textContent = "복사", 1500); });
    el.parentElement.append(b);
  });
  const meta = root.querySelector("blockquote");
  if (meta && meta.textContent.trim().startsWith("⏱")) {
    meta.className = "meta";
    meta.innerHTML = meta.textContent.trim().split(" · ").map(t => `<span>${esc(t)}</span>`).join("");
  }
  const kinds = { "핵심 정리": "summary", "스스로 점검": "quiz", "직접 고쳐보기": "practice" };
  root.querySelectorAll("h2").forEach(h => {
    const kind = Object.keys(kinds).find(k => h.textContent.includes(k));
    if (!kind) return;
    const box = Object.assign(document.createElement("section"), { className: "box " + kinds[kind] });
    h.before(box);
    for (let el = h, nxt; el && (el === h || el.tagName !== "H2"); el = nxt) { nxt = el.nextElementSibling; box.append(el); }
  });
  const hs = [...root.querySelectorAll("h2")];
  $("aside").innerHTML = hs.length > 2 ? "<b>이 레슨에서</b>" : "";
  if (hs.length > 2) hs.forEach(h => {
    const a = Object.assign(document.createElement("a"), { href: "#", textContent: h.textContent });
    a.onclick = e => { e.preventDefault(); h.scrollIntoView({ behavior: "smooth" }); };
    $("aside").append(a);
  });
}

async function showGlossary() {
  renderToc(); renderEnd();
  const res = await fetch("glossary.md");
  $("content").innerHTML = res.ok ? marked.parse(await res.text()) : "용어 사전을 불러오지 못했습니다.";
  $("bar").innerHTML = `<input id="q" type="search" placeholder="용어 검색 (예: 로스, LoRA, 어텐션)" aria-label="용어 검색">`;
  $("aside").innerHTML = "";
  const items = [...$("content").querySelectorAll("p:has(> strong:first-child)")];
  $("q").oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    items.forEach(p => p.hidden = !p.textContent.toLowerCase().includes(q));
    // 남은 용어가 없는 분류 제목은 숨김
    $("content").querySelectorAll("h2").forEach(h => {
      let el = h.nextElementSibling, any = false;
      for (; el && el.tagName !== "H2"; el = el.nextElementSibling) any ||= !el.hidden;
      h.hidden = !any;
    });
  };
  document.title = "용어 사전";
  scrollTo(0, 0);
}

async function show() {
  if (innerWidth <= 860) $("menu").open = false;
  $("tip").hidden = true;
  const glossary = location.hash === "#glossary";
  $("glink").className = glossary ? "on" : "";
  if (glossary) return showGlossary();
  const i = Math.max(0, lessons.findIndex(l => l.id === location.hash.slice(1)));
  const l = lessons[i], prev = lessons[i - 1], next = lessons[i + 1];
  renderToc(l.id);
  const res = await fetch(`lessons/${l.id}.md`);
  $("content").innerHTML = res.ok ? marked.parse(await res.text()) : "레슨을 불러오지 못했습니다.";
  decorate($("content"));
  linkTerms($("content"));
  $("bar").innerHTML = `<span class="crumb">${esc(l.part)}</span><span class="grow"></span>` +
    (prev ? `<a class="btn" href="#${prev.id}" aria-label="이전 레슨">←</a>` : "") + (next ? `<a class="btn" href="#${next.id}" aria-label="다음 레슨">→</a>` : "") +
    (l.code ? `<a class="btn primary" target="_blank" rel="noopener" href="https://colab.research.google.com/github/${REPO}/blob/main/notebooks/${l.id}.ipynb">▶ Colab에서 실행하기</a>` : "");
  renderEnd(l.id);
  document.title = l.title;
  scrollTo(0, 0);
}

Promise.all([fetch("lessons.json").then(r => r.json()), fetch("glossary.md").then(r => r.text()).catch(() => "")])
  .then(([j, g]) => { lessons = j; parseGlossary(g); show(); addEventListener("hashchange", show); })
  .catch(() => $("content").textContent = "lessons.json을 불러오지 못했습니다. 로컬에서는 `python -m http.server` 로 열어주세요.");
</script>
</body>
</html>
