<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딥러닝 · LLM · VLM 직접 만들며 배우기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<style>
:root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --side:#f6f8fa; --accent:#0969da; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --side:#161b22; --accent:#4493f8; } }
* { box-sizing: border-box; }
body { margin:0; display:flex; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.75 system-ui, "Malgun Gothic", sans-serif; }
nav { width:300px; flex-shrink:0; background:var(--side); border-right:1px solid var(--line); padding:20px 16px; position:sticky; top:0; height:100vh; overflow-y:auto; }
nav h1 { font-size:17px; margin:0 0 4px; }
nav p { color:var(--muted); font-size:13px; margin:0 0 16px; }
nav ol { list-style:none; margin:0; padding:0; }
nav li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; }
nav li.on { background:var(--bg); outline:1px solid var(--line); }
nav a { color:var(--fg); text-decoration:none; font-size:14px; flex:1; }
nav li.on a { color:var(--accent); font-weight:600; }
main { flex:1; min-width:0; padding:32px 16px 80px; }
article { max-width:820px; margin:0 auto; }
article h1 { margin-top:0; }
article h2 { margin-top:2em; padding-bottom:.3em; border-bottom:1px solid var(--line); }
article a, .bar a { color:var(--accent); }
article pre { border-radius:8px; overflow-x:auto; font-size:14px; line-height:1.5; }
article pre code { display:block; padding:14px 16px; background:#0d1117; color:#e6edf3; }
article :not(pre) > code { background:var(--side); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:.9em; }
article blockquote { margin:1em 0; padding:.2em 1em; border-left:4px solid var(--accent); background:var(--side); }
article table { border-collapse:collapse; display:block; overflow-x:auto; }
article th, article td { border:1px solid var(--line); padding:6px 12px; }
.bar { max-width:820px; margin:0 auto 24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:14px; }
.btn { border:1px solid var(--line); border-radius:6px; padding:6px 14px; text-decoration:none; background:var(--side); }
.bar .grow { flex:1; }
.bar input { flex:1; min-width:0; font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
nav .gl { margin:16px 0 0; padding:12px 8px 0; border-top:1px solid var(--line); font-size:14px; }
nav .gl a.on { color:var(--accent); font-weight:600; }
@media (max-width: 760px) { body { display:block; } nav { width:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<nav>
  <h1>🧠 직접 만들며 배우는 딥러닝</h1>
  <p id="progress"></p>
  <ol id="toc"></ol>
  <p class="gl"><a id="glink" href="#glossary">📖 용어 사전</a></p>
</nav>
<main>
  <div class="bar" id="bar"></div>
  <article id="content">불러오는 중…</article>
</main>
<script>
const REPO = "Yun-sooyong/dl-study"; // Colab 링크용. 저장소 이름을 바꾸면 여기도 수정
const $ = id => document.getElementById(id);
// 진도 체크는 이 브라우저에만 저장됨 (localStorage)
const done = (() => { try { return new Set(JSON.parse(localStorage.done || "[]")); } catch { return new Set(); } })();
const save = () => { try { localStorage.done = JSON.stringify([...done]); } catch {} };
let lessons = [];

function renderToc(cur) {
  $("progress").textContent = `진도 ${lessons.filter(l => done.has(l.id)).length} / ${lessons.length}`;
  $("toc").innerHTML = "";
  for (const l of lessons) {
    const li = document.createElement("li");
    if (l.id === cur) li.className = "on";
    const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: done.has(l.id), title: "완료 표시" });
    cb.setAttribute("aria-label", l.title + " 완료");
    cb.onchange = () => { cb.checked ? done.add(l.id) : done.delete(l.id); save(); renderToc(cur); };
    const a = Object.assign(document.createElement("a"), { href: "#" + l.id, textContent: l.title });
    li.append(cb, a);
    $("toc").append(li);
  }
}

async function showGlossary() {
  renderToc();
  const res = await fetch("glossary.md");
  $("content").innerHTML = res.ok ? marked.parse(await res.text()) : "용어 사전을 불러오지 못했습니다.";
  $("bar").innerHTML = `<input id="q" type="search" placeholder="용어 검색 (예: 로스, LoRA, 어텐션)" aria-label="용어 검색">`;
  const terms = [...$("content").querySelectorAll("p:has(> strong:first-child)")];
  $("q").oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    terms.forEach(p => p.hidden = !p.textContent.toLowerCase().includes(q));
    // 남은 용어가 없는 분류 제목은 숨김
    $("content").querySelectorAll("h2").forEach(h => {
      let el = h.nextElementSibling, any = false;
      for (; el && el.tagName !== "H2"; el = el.nextElementSibling) any ||= !el.hidden;
      h.hidden = !any;
    });
  };
  document.title = "용어 사전";
  scrollTo(0, 0);
}

async function show() {
  const glossary = location.hash === "#glossary";
  $("glink").className = glossary ? "on" : "";
  if (glossary) return showGlossary();
  const i = Math.max(0, lessons.findIndex(l => l.id === location.hash.slice(1)));
  const l = lessons[i], prev = lessons[i - 1], next = lessons[i + 1];
  renderToc(l.id);
  const res = await fetch(`lessons/${l.id}.md`);
  $("content").innerHTML = res.ok ? marked.parse(await res.text()) : "레슨을 불러오지 못했습니다.";
  $("content").querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
  $("bar").innerHTML =
    (l.code ? `<a class="btn" target="_blank" rel="noopener" href="https://colab.research.google.com/github/${REPO}/blob/main/notebooks/${l.id}.ipynb">▶ Colab에서 실행하기</a>` : "") +
    `<span class="grow"></span>` +
    (prev ? `<a href="#${prev.id}">← 이전</a>` : "") + (next ? `<a href="#${next.id}">다음 →</a>` : "");
  document.title = l.title;
  scrollTo(0, 0);
}

fetch("lessons.json").then(r => r.json()).then(j => { lessons = j; show(); addEventListener("hashchange", show); })
  .catch(() => $("content").textContent = "lessons.json을 불러오지 못했습니다. 로컬에서는 `python -m http.server` 로 열어주세요.");
</script>
</body>
</html>
